gates:
  autonomous_merge_allowed:
    - no financial-impacting semantics
    - no identity/security model change
    - no rights/distribution policy change
    - no destructive migration
    - all CI green
    - architecture review green
    - no-code-lies scan green
  human_approval_required:
    - wallet_or_ledger_material_change
    - Stari_settlement_semantics
    - payout_logic
    - identity_security_model
    - rights_distribution_policy
    - destructive_production_migration
    - production_secrets
    - breaking_external_api